name: CI

# Runs only on GitHub. The main repo is on Gitea, where Renovate works, and a
# push mirror copies every branch here. GitHub tests and builds, reports the
# result back to Gitea (commit status "github-ci", required to merge) and
# publishes new versions from main.
on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash adds pipefail to every run step.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck on the s6 scripts
        run: shellcheck wireguard_client/rootfs/etc/s6-overlay/s6-rc.d/*/{run,finish}

      - name: Run Home Assistant app linter
        uses: frenck/action-addon-linter@479f4f053b96ed00a83ce2c7d8f858e22475aa98 # v2.21
        with:
          path: "./wireguard_client"

  megalinter:
    name: MegaLinter
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Linters are listed in .mega-linter.yml
      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/python@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          VALIDATE_ALL_CODEBASE: true

  e2e:
    name: End-to-end test
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run end-to-end test
        run: test/e2e.sh

  report:
    name: Report to Gitea
    needs: [lint, megalinter, e2e, build]
    if: always() && github.server_url == 'https://github.com' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Set commit status github-ci on Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          STATE: ${{ needs.lint.result == 'success' && needs.megalinter.result == 'success' && needs.e2e.result == 'success' && needs.build.result == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg state "$STATE" --arg url "$URL" \
            '{state: $state, context: "github-ci", target_url: $url, description: "Lint, MegaLinter, end-to-end test and build on GitHub"}' |
            curl -fsS -o /dev/null -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" -d @- \
              "https://gitea.gerasch.dev/api/v1/repos/privat/ha-wireguard-client/statuses/$GITHUB_SHA"

  release:
    name: Check for new version
    needs: [lint, megalinter, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only on main and only when config.yaml carries a version that is
      # not on ghcr yet, so an existing tag is never overwritten. Other runs do
      # not ask the registry at all. Any unexpected answer fails the job.
      - name: Compare version with registry
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT != push || $GITHUB_REF != refs/heads/main ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo=$(yq -r .image wireguard_client/config.yaml); repo=${repo#ghcr.io/}
          version=$(yq -r .version wireguard_client/config.yaml)
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/$repo/manifests/$version")
          case $code in
            200) publish=false ;;
            404) publish=true ;;
            *) echo "::error::Registry answered $code for $repo:$version"; exit 1 ;;
          esac
          echo "Publish $repo:$version: $publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: release
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: wireguard_client
      publish: ${{ needs.release.outputs.publish == 'true' }}
