# https://contributors.home-assistant.io/apps/reference/configuration/
name: WireGuard Client
version: "1.0.0"
slug: wireguard_client
description: Keeps this Home Assistant connected to a WireGuard server
url: "https://github.com/DerGary/ha-wireguard-client"
arch:
  - aarch64
  - amd64
init: false
startup: services
host_network: true
tmpfs: true
privileged:
  - NET_ADMIN
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 61820
panel_icon: mdi:vpn
options:
  allowed_ips: "172.16.0.0/24"
  persistent_keepalive: 25
schema:
  private_key: password
  address: "match(^[0-9.]+(/[0-9]+)?$)"
  server_public_key: "match(^[A-Za-z0-9+/]{43}=$)"
  preshared_key: password?
  endpoint: "match(^([A-Za-z0-9.-]+|\\[[0-9a-fA-F:]+\\]):[0-9]+$)"
  allowed_ips: "match(^[0-9.]+/[0-9]+( *, *[0-9.]+/[0-9]+)*$)"
  persistent_keepalive: int(1,65535)
image: "ghcr.io/dergary/ha-wireguard-client"
