configuration:
  private_key:
    name: Private Key
    description: Privater Schlüssel dieses Clients (PrivateKey aus dem [Interface]-Block der Client-Konfiguration).
  address:
    name: VPN-Adresse
    description: Adresse dieses Clients im VPN, z. B. 172.16.0.11 (Address aus dem [Interface]-Block).
  server_public_key:
    name: Public Key des Servers
    description: PublicKey aus dem [Peer]-Block der Client-Konfiguration.
  preshared_key:
    name: Preshared Key
    description: PresharedKey aus dem [Peer]-Block, falls vorhanden.
  endpoint:
    name: Server-Adresse
    description: Endpoint aus dem [Peer]-Block, z. B. vpn.example.com:51820.
  allowed_ips:
    name: Erlaubte IPs
    description: Netze, die durch den Tunnel gehen, mit Komma getrennt. Nur private Netze (10.x, 172.16-31.x, 192.168.x, 100.64-127.x), z. B. das VPN-Netz.
  persistent_keepalive:
    name: Keepalive (Sekunden)
    description: Hält die Verbindung durch NAT und Router offen. 25 ist der empfohlene Wert. Wird auch zur Erkennung von Verbindungsabbrüchen gebraucht.
