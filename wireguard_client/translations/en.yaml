configuration:
  private_key:
    name: Private key
    description: Private key of this client (PrivateKey from the [Interface] section of the client config).
  address:
    name: VPN address
    description: Address of this client inside the VPN, e.g. 172.16.0.11 (Address from the [Interface] section).
  server_public_key:
    name: Server public key
    description: PublicKey from the [Peer] section of the client config.
  preshared_key:
    name: Preshared key
    description: PresharedKey from the [Peer] section, if there is one.
  endpoint:
    name: Server address
    description: Endpoint from the [Peer] section, e.g. vpn.example.com:51820.
  allowed_ips:
    name: Allowed IPs
    description: Networks routed through the tunnel, comma separated. Only the VPN network, never 0.0.0.0/0.
  persistent_keepalive:
    name: Keepalive (seconds)
    description: Keeps the connection open through NAT and routers. 25 is the recommended value, 0 turns it off.
